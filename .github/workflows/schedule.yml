name: 4-Hour Data Refresh

on:
  schedule:
    # Safety net: run every 4 hours in case a webhook event is missed
    - cron: "0 */4 * * *"
  workflow_dispatch:  # Allows manual triggering
  repository_dispatch:
    # Fired instantly by the Strava webhook (web/src/app/api/strava-webhook)
    # and by the WHOOP webhook (web/src/app/api/whoop/webhook)
    types: [strava-activity, whoop-data]

jobs:
  run-refresh:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out the repository WITH PUSH PERMISSIONS
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # 2️⃣ Set up Python
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r Training_Intensity_Report/requirements.txt

      # 4️⃣ Set up credentials from GitHub Secrets (written to config folder)
      - name: Setup credentials
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          mkdir -p Training_Intensity_Report/config
          echo "$CREDENTIALS_JSON" > Training_Intensity_Report/config/credentials.json

      # 5️⃣ OPTIONAL: List files to verify correct paths
      - name: List files (debug)
        run: ls -R

      # 6️⃣ Run Strava refresh script
      - name: Run Strava refresh script
        run: python Training_Intensity_Report/dashboard/refresh_app_daily.py

      # 7️⃣ Run WHOOP history fetch (script exits cleanly if secret is missing)
      - name: Run WHOOP fetch script
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
        run: python Training_Intensity_Report/dashboard/fetch_whoop.py

      # 8️⃣ Commit and push any updated data files
      - name: Commit and push changes
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Sync CSV to Next.js public folder so Vercel picks up fresh data
          cp Training_Intensity_Report/dashboard/data/activity_data_with_intensity.csv web/public/data/activity_data_with_intensity.csv

          # Stage all updated data files
          git add Training_Intensity_Report/dashboard/data/*.csv
          git add web/public/data/activity_data_with_intensity.csv
          git add web/public/data/whoop_history.json

          # Commit only if there are changes
          git diff --cached --quiet || git commit -m "Automated data refresh"

          # ✅ Force push using token (bypasses 403 issues)
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
