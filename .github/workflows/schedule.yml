name: 4-Hour Data Refresh

on:
  schedule:
    # Safety net: run every 4 hours in case a webhook event is missed
    - cron: "0 */4 * * *"
  workflow_dispatch:  # Allows manual triggering
  repository_dispatch:
    # Fired instantly by the WHOOP webhook (web/src/app/api/whoop/webhook)
    types: [whoop-data]

jobs:
  run-refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1️⃣ Check out the repository WITH PUSH PERMISSIONS
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # 2️⃣ Set up Python
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r Training_Intensity_Report/requirements.txt

      # 4️⃣ Fetch WHOOP data: recovery/sleep/strain history + workouts merged
      #    into activity_data_with_intensity.csv (Strava history is frozen).
      #    Skips cleanly (exit 0) if WHOOP_REFRESH_TOKEN is unset, but FAILS the
      #    run (exit 1) if the token is expired/invalid — so a stale token
      #    surfaces as a failed workflow instead of silently freezing the data.
      - name: Run WHOOP fetch script
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          # GH_PAT must be a classic PAT with 'repo' scope (or fine-grained with Secrets read+write).
          # Create one at github.com/settings/tokens and store it as the GH_PAT secret.
          # Without it the script still fetches WHOOP data — it just won't auto-rotate the secret.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python Training_Intensity_Report/dashboard/fetch_whoop.py

      # 5️⃣ Commit and push any updated data files
      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Sync CSV to Next.js public folder so Vercel picks up fresh data
          cp Training_Intensity_Report/dashboard/data/activity_data_with_intensity.csv web/public/data/activity_data_with_intensity.csv

          # Stage all updated data files
          git add Training_Intensity_Report/dashboard/data/*.csv
          git add web/public/data/activity_data_with_intensity.csv
          git add web/public/data/activity_supplement.csv
          git add web/public/data/hr_summaries.csv
          git add web/public/data/whoop_history.json
          git add web/public/data/whoop_body_measurement.json

          # Commit only if there are changes
          git diff --cached --quiet || git commit -m "Automated data refresh"

          # ✅ Force push using token (bypasses 403 issues)
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
