name: 12-Hour Data Refresh

on:
  schedule:
    # Safety net: run every 12 hours in case a webhook event is missed
    - cron: "0 */12 * * *"
  workflow_dispatch:  # Allows manual triggering
  repository_dispatch:
    # Fired instantly by the WHOOP webhook (web/src/app/api/whoop/webhook)
    types: [whoop-data]

# WHOOP refresh tokens are single-use and rotate on every fetch. Runs must be
# serialized, otherwise two simultaneous runs (WHOOP sends duplicate webhooks)
# both use the same token and the loser fails with HTTP 400.
concurrency:
  group: whoop-data-refresh
  cancel-in-progress: false

# Serializing alone isn't enough: WHOOP sends sleep.updated and recovery.updated
# together each morning, and the queued second run still starts with the old
# (already-used) token. Two guards (.github/scripts/whoop_guard.sh) fix this
# without ever dropping data:
#   1. dedupe: a webhook run skips only if a refresh that started AFTER it was
#      triggered already succeeded (that refresh already fetched its data).
#   2. token-check: if the token was used up by another successful run, the run
#      re-triggers itself fresh instead of failing. A truly bad token still fails.
jobs:
  dedupe:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout repo
        if: github.event_name == 'repository_dispatch'
        uses: actions/checkout@v4

      - name: Skip if a later refresh already covered this one
        id: check
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/whoop_guard.sh skip-check

  run-refresh:
    needs: dedupe
    if: needs.dedupe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      # 1️⃣ Check out the repository WITH PUSH PERMISSIONS
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # 2️⃣ Set up Python
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r Training_Intensity_Report/requirements.txt

      # 4️⃣ Fetch WHOOP data: recovery/sleep/strain history + workouts merged
      #    into activity_data_with_intensity.csv (Strava history is frozen).
      #    Skips cleanly (exit 0) if WHOOP_REFRESH_TOKEN is unset, but FAILS the
      #    run (exit 1) if the token is expired/invalid — so a stale token
      #    surfaces as a failed workflow instead of silently freezing the data.
      - name: Run WHOOP fetch script
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          # GH_PAT must be a classic PAT with 'repo' scope (or fine-grained with Secrets read+write).
          # Create one at github.com/settings/tokens and store it as the GH_PAT secret.
          # Without it the script still fetches WHOOP data — it just won't auto-rotate the secret.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        id: fetch
        run: |
          set +e
          python Training_Intensity_Report/dashboard/fetch_whoop.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 3 = token rejected: handled by the next step instead of failing here.
          [ "$code" -eq 3 ] && exit 0
          exit $code

      # 4b. Token rejected: retry if another run just rotated it, else fail.
      #     Uses the built-in GITHUB_TOKEN: repository_dispatch is one of the
      #     few events it is allowed to trigger, so this doesn't depend on GH_PAT.
      - name: Handle rejected WHOOP token
        if: steps.fetch.outputs.code == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHOOP_RETRY: ${{ github.event.client_payload.retry }}
        run: bash .github/scripts/whoop_guard.sh token-check

      # 5️⃣ Commit and push any updated data files
      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Sync CSV to Next.js public folder so Vercel picks up fresh data
          cp Training_Intensity_Report/dashboard/data/activity_data_with_intensity.csv web/public/data/activity_data_with_intensity.csv

          # Stage all updated data files
          git add Training_Intensity_Report/dashboard/data/*.csv
          git add web/public/data/activity_data_with_intensity.csv
          git add web/public/data/activity_supplement.csv
          git add web/public/data/hr_summaries.csv
          git add web/public/data/whoop_history.json
          git add web/public/data/whoop_body_measurement.json

          # Commit only if there are changes
          git diff --cached --quiet || git commit -m "Automated data refresh"

          # Push using the token. If main moved while this run was working, rebase
          # onto it (our fresh data wins any conflict) and retry.
          REMOTE=https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          for attempt in 1 2 3 4; do
            git push "$REMOTE" HEAD:main && exit 0
            echo "Push rejected (attempt $attempt), rebasing onto latest main…"
            git pull --rebase -X theirs "$REMOTE" main
          done
          echo "::error::Could not push after 4 attempts"
          exit 1
